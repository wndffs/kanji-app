name: Deploy staging database

on:
  workflow_dispatch:
    inputs:
      rolled_back_migration:
        description: Failed migration to mark as rolled back before deploy (normally empty)
        required: false
        type: string
      seed_starter:
        description: Initialize starter demo (do not enable after editorial curation)
        required: true
        default: false
        type: boolean
      starter_editorial:
        description: Apply only the reviewed starter lesson texts and reference meanings (no migration or seed)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-database
  cancel-in-progress: false

jobs:
  migrate-and-seed:
    name: Migrate and seed Neon
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify staging database secret
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Repository secret STAGING_DATABASE_URL is required."
            exit 1
          fi

      - name: Resolve failed migration
        if: ${{ !inputs.starter_editorial && inputs.rolled_back_migration != '' }}
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          FAILED_MIGRATION: ${{ inputs.rolled_back_migration }}
        run: npm exec -- prisma migrate resolve --rolled-back "$FAILED_MIGRATION"

      - name: Apply Prisma migrations
        if: ${{ !inputs.starter_editorial }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_ENV: production
        run: npm run db:migrate:deploy

      - name: Seed starter course
        if: ${{ !inputs.starter_editorial && inputs.seed_starter }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_ENV: production
        run: npm run db:seed

      - name: Apply reviewed starter texts
        if: ${{ inputs.starter_editorial }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_ENV: production
          SEED_REQUESTED: ${{ inputs.seed_starter }}
          MIGRATION_RESOLUTION: ${{ inputs.rolled_back_migration }}
        run: |
          if [ "$SEED_REQUESTED" = true ] || [ -n "$MIGRATION_RESOLUTION" ]; then
            echo "Starter editorial cannot be combined with seed or migration resolution."
            exit 1
          fi
          npm exec -- tsx packages/db/prisma/apply-starter-lesson-editorial.ts plan
          npm exec -- tsx packages/db/prisma/apply-starter-lesson-editorial.ts apply
