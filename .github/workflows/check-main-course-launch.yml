name: Check main course launch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-database
  cancel-in-progress: false

jobs:
  readiness:
    name: Check main course without writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The transaction budget is capped at 30 minutes, plus runner setup.
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run the publication checks in a read-only snapshot
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run course:check-launch --workspace @kanji-srs/api
