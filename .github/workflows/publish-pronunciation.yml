name: Verified pronunciation attachment
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan or explicit one-word pronunciation attachment
        required: true
        default: plan
        type: choice
        options: [plan, apply]
permissions:
  contents: read
concurrency:
  group: staging-database
  cancel-in-progress: false
jobs:
  pronunciation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run db:generate
      - name: Plan or explicitly attach verified pronunciation
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          case "$MODE" in plan|apply) ;; *) exit 1 ;; esac
          npm exec -- tsx packages/db/prisma/publish-pronunciation.ts "--$MODE"
