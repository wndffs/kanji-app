name: Deploy staging curation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or explicit application
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      kanji_batch:
        description: Optional registered kanji batch ID (empty with word_batch skips kanji)
        required: false
        type: string
      word_batch:
        description: Optional registered word batch IDs, comma-separated (empty reapplies all curation)
        required: false
        type: string
      skip_words:
        description: Skip all vocabulary writes (requires kanji_batch and empty word_batch)
        type: boolean
        default: false
      supplement_word_sources:
        description: Import only missing raw sources for reviewed words from the pinned snapshot (max 100 pairs)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-database
  cancel-in-progress: false

jobs:
  curate:
    name: Apply versioned curation to Neon
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      CURATION_MODE: ${{ inputs.mode }}
      WORD_BATCH: ${{ inputs.word_batch }}
      KANJI_BATCH: ${{ inputs.kanji_batch }}
      SKIP_WORDS: ${{ inputs.skip_words }}
      SUPPLEMENT_WORD_SOURCES: ${{ inputs.supplement_word_sources }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify selection guardrails
        run: npm exec -- vitest run scripts/staging-curation-selection.test.ts --no-cache --no-fsModuleCache --configLoader runner --maxWorkers=1

      - name: Resolve explicit curation selection before database writes
        id: selection
        run: node scripts/staging-curation-selection.mjs >> "$GITHUB_OUTPUT"

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify staging database secret
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Repository secret STAGING_DATABASE_URL is required."
            exit 1
          fi

      - name: Validate selected word manifests before any database writes
        if: ${{ steps.selection.outputs.apply_words == 'true' }}
        shell: bash
        run: |
          args=()
          if [ -n "$WORD_BATCH" ]; then
            IFS=',' read -ra ids <<< "$WORD_BATCH"
            for id in "${ids[@]}"; do args+=(--batch "$id"); done
          fi
          npm run db:curate:words -- --validate-only "${args[@]}"

      - name: Validate selected kanji manifests before any database writes
        if: ${{ steps.selection.outputs.apply_kanji == 'true' }}
        shell: bash
        run: |
          args=()
          if [ -n "$KANJI_BATCH" ]; then args+=(--batch "$KANJI_BATCH"); fi
          npm run db:curate -- --validate-only "${args[@]}"

      - name: Check existing published content before new teaching writes
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: >-
          npm run content:quality --
          --output "$RUNNER_TEMP/pre-curation-quality-report.json"

      - name: Restore pinned source snapshot for explicit word supplement
        id: word-source-cache
        if: ${{ steps.selection.outputs.supplement_word_sources == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kanji-content-snapshots/2026-10-31
          key: content-sources-v2-${{ runner.os }}-2026-10-31-${{ hashFiles('scripts/prepare-content-snapshot.mjs') }}

      - name: Verify pinned source snapshot for explicit word supplement
        if: ${{ steps.selection.outputs.supplement_word_sources == 'true' }}
        run: >-
          node scripts/prepare-content-snapshot.mjs
          --snapshot-version 2026-10-31
          --cache-root "$RUNNER_TEMP/kanji-content-snapshots"
          --expected-jmdict-archive-sha256 c09c402a69dbe2eb02cb8e9e7510e51bd512e53cb26e162901323cfaf3ed5eff
          --expected-kanjidic2-archive-sha256 8e70bfa3a7a7df640e3ba254a80438201904d95df0fb23c9323476c2676d3346
          --expected-kanjivg-archive-sha256 b36579789775ea912d5e98356bf243f54fb953fa3b58a16c2d6995f252e2a3e2

      - name: Cache verified source snapshot for later supplements
        if: ${{ steps.selection.outputs.supplement_word_sources == 'true' && steps.word-source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kanji-content-snapshots/2026-10-31
          key: ${{ steps.word-source-cache.outputs.cache-primary-key }}

      - name: Plan missing reviewed word sources without mutations
        if: ${{ steps.selection.outputs.supplement_word_sources == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: >-
          npm exec -- tsx scripts/import-missing-reviewed-word-sources.mts
          --snapshot-dir "$RUNNER_TEMP/kanji-content-snapshots/2026-10-31"

      - name: Apply missing reviewed word sources
        if: ${{ inputs.mode == 'apply' && steps.selection.outputs.supplement_word_sources == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: >-
          npm exec -- tsx scripts/import-missing-reviewed-word-sources.mts
          --snapshot-dir "$RUNNER_TEMP/kanji-content-snapshots/2026-10-31" --apply

      - name: Preflight selected kanji without mutations
        if: ${{ steps.selection.outputs.apply_kanji == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          if [ -n "$KANJI_BATCH" ]; then args+=(--batch "$KANJI_BATCH"); fi
          npm run db:curate -- --preflight-only "${args[@]}"

      - name: Apply versioned main-course curation
        if: ${{ inputs.mode == 'apply' && steps.selection.outputs.apply_kanji == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          if [ -n "$KANJI_BATCH" ]; then args+=(--batch "$KANJI_BATCH"); fi
          npm run db:curate -- "${args[@]}"

      - name: Preflight reviewed vocabulary without mutations
        # Apply performs this same full-registry preflight internally before any teaching write.
        if: ${{ inputs.mode == 'plan' && steps.selection.outputs.apply_words == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          if [ -n "$WORD_BATCH" ]; then
            IFS=',' read -ra ids <<< "$WORD_BATCH"
            for id in "${ids[@]}"; do args+=(--batch "$id"); done
          fi
          npm run db:curate:words -- --preflight-only "${args[@]}"

      - name: Apply reviewed vocabulary and original examples
        if: ${{ inputs.mode == 'apply' && steps.selection.outputs.apply_words == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          if [ -n "$WORD_BATCH" ]; then
            IFS=',' read -ra ids <<< "$WORD_BATCH"
            for id in "${ids[@]}"; do args+=(--batch "$id"); done
          fi
          npm run db:curate:words -- "${args[@]}"

      - name: Write post-curation corpus report
        if: ${{ inputs.mode == 'apply' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: >-
          npm run content:report --
          --require-full
          --output "$RUNNER_TEMP/task-118-corpus-report.json"

      - name: Verify published main-course content quality
        if: ${{ inputs.mode == 'apply' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: >-
          npm run content:quality --
          --output "$RUNNER_TEMP/task-119-quality-report.json"

      - name: Upload corpus report
        if: ${{ always() && inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: task-118-curation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/task-118-corpus-report.json
            ${{ runner.temp }}/task-119-quality-report.json
          if-no-files-found: warn
          retention-days: 90
