name: Deploy staging curation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Teaching preflight/application, source inventory or supplement, or receipt check
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - audit_sources
          - plan_sources
          - apply_sources
          - receipts
      kanji_batch:
        description: Optional registered kanji batch ID (empty with word_batch skips kanji)
        required: false
        type: string
      word_batch:
        description: Explicit registered word batch IDs, comma-separated (empty only for plan or kanji-only)
        required: false
        type: string
      skip_words:
        description: Skip all vocabulary writes (requires kanji_batch and empty word_batch)
        type: boolean
        default: false
      supplement_word_sources:
        description: Import only missing raw sources for reviewed words from the pinned snapshot (max 100 pairs)
        type: boolean
        default: false
      source_pair_limit:
        description: Only for plan_sources/apply_sources, exact missing pairs per window (1–100)
        type: number
        default: 100
      stage_word_pairs:
        description: For word-only apply with existing raw sources, stage new word items concurrently
        type: boolean
        default: false
      stage_word_width:
        description: Parallel new items when stage_word_pairs is enabled (2 or 4)
        type: number
        default: 2
      stage_kanji_pairs:
        description: For kanji-only apply, stage two new kanji items at once
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-database
  cancel-in-progress: false

jobs:
  curate:
    name: Apply versioned curation to Neon
    runs-on: ubuntu-latest
    # Large selected releases can exceed 90 minutes on Neon.
    # Individual staging/finalization transactions retain their own bounded deadlines.
    timeout-minutes: 180
    env:
      NODE_ENV: production
      CURATION_MODE: ${{ inputs.mode }}
      WORD_BATCH: ${{ inputs.word_batch }}
      KANJI_BATCH: ${{ inputs.kanji_batch }}
      SKIP_WORDS: ${{ inputs.skip_words }}
      SUPPLEMENT_WORD_SOURCES: ${{ inputs.supplement_word_sources }}
      SOURCE_PAIR_LIMIT: ${{ inputs.source_pair_limit }}
      STAGE_WORD_PAIRS: ${{ inputs.stage_word_pairs }}
      STAGE_WORD_WIDTH: ${{ inputs.stage_word_width }}
      STAGE_KANJI_PAIRS: ${{ inputs.stage_kanji_pairs }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify selection guardrails
        run: npm exec -- vitest run scripts/staging-curation-selection.test.ts scripts/reviewed-source-pins.test.ts --no-cache --no-fsModuleCache --configLoader runner --maxWorkers=1

      - name: Resolve explicit curation selection before database writes
        id: selection
        run: node scripts/staging-curation-selection.mjs >> "$GITHUB_OUTPUT"

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify staging database secret
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Repository secret STAGING_DATABASE_URL is required."
            exit 1
          fi

      - name: Validate selected word manifests before any database writes
        if: ${{ steps.selection.outputs.apply_words == 'true' || steps.selection.outputs.source_only == 'true' }}
        shell: bash
        run: |
          args=()
          if [ -n "$WORD_BATCH" ]; then
            IFS=',' read -ra ids <<< "$WORD_BATCH"
            for id in "${ids[@]}"; do args+=(--batch "$id"); done
          fi
          npm run db:curate:words -- --validate-only "${args[@]}"

      - name: Validate selected kanji manifests before any database writes
        if: ${{ steps.selection.outputs.apply_kanji == 'true' }}
        shell: bash
        run: |
          args=()
          if [ -n "$KANJI_BATCH" ]; then args+=(--batch "$KANJI_BATCH"); fi
          npm run db:curate -- --validate-only "${args[@]}"

      - name: Read selected manifest receipts without mutations
        if: ${{ inputs.mode == 'receipts' || inputs.mode == 'apply' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          if [ -n "$KANJI_BATCH" ]; then args+=(--kanji-batch "$KANJI_BATCH"); fi
          if [ -n "$WORD_BATCH" ]; then
            IFS=',' read -ra ids <<< "$WORD_BATCH"
            for id in "${ids[@]}"; do args+=(--word-batch "$id"); done
          fi
          if [ "$CURATION_MODE" = 'apply' ]; then args+=(--expect unfinished); fi
          npm run content:receipts -- "${args[@]}"

      - name: Check existing published content before new teaching writes
        if: ${{ inputs.mode != 'receipts' && steps.selection.outputs.source_only != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: >-
          npm run content:quality --
          --output "$RUNNER_TEMP/pre-curation-quality-report.json"

      - name: Capture private release preservation baseline
        id: preservation
        if: ${{ inputs.mode == 'apply' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm exec -- tsx packages/db/prisma/check-curation-preservation.ts capture

      - name: Resolve the verified source pin for the exact vocabulary selection
        id: source-pin
        if: ${{ steps.selection.outputs.supplement_word_sources == 'true' }}
        run: node scripts/reviewed-source-pins.mjs >> "$GITHUB_OUTPUT"

      - name: Audit aggregate source inventory without archive downloads or mutations
        if: ${{ inputs.mode == 'audit_sources' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          IFS=',' read -ra ids <<< "$WORD_BATCH"
          for id in "${ids[@]}"; do args+=(--batch "$id"); done
          npm exec -- tsx scripts/audit-reviewed-word-inventory.mts "${args[@]}"

      - name: Restore pinned source snapshot for explicit word supplement
        id: word-source-cache
        if: ${{ steps.selection.outputs.supplement_word_sources == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kanji-content-snapshots/${{ steps.source-pin.outputs.version }}
          key: content-sources-v2-${{ runner.os }}-${{ steps.source-pin.outputs.version }}-${{ hashFiles('scripts/prepare-content-snapshot.mjs') }}

      - name: Verify pinned source snapshot for explicit word supplement
        if: ${{ steps.selection.outputs.supplement_word_sources == 'true' }}
        run: >-
          node scripts/prepare-content-snapshot.mjs
          --snapshot-version ${{ steps.source-pin.outputs.version }}
          --cache-root "$RUNNER_TEMP/kanji-content-snapshots"
          --expected-jmdict-archive-sha256 ${{ steps.source-pin.outputs.jmdict }}
          --expected-kanjidic2-archive-sha256 ${{ steps.source-pin.outputs.kanjidic2 }}
          --expected-kanjivg-archive-sha256 ${{ steps.source-pin.outputs.kanjivg }}

      - name: Cache verified source snapshot for later supplements
        if: ${{ steps.selection.outputs.supplement_word_sources == 'true' && steps.word-source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kanji-content-snapshots/${{ steps.source-pin.outputs.version }}
          key: ${{ steps.word-source-cache.outputs.cache-primary-key }}

      - name: Plan missing reviewed word sources without mutations
        if: ${{ steps.selection.outputs.supplement_word_sources == 'true' && inputs.mode != 'apply_sources' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SOURCE_SNAPSHOT_VERSION: ${{ steps.source-pin.outputs.version }}
        shell: bash
        run: |
          args=()
          IFS=',' read -ra ids <<< "$WORD_BATCH"
          for id in "${ids[@]}"; do args+=(--batch "$id"); done
          if [ "$CURATION_MODE" = 'plan_sources' ]; then args+=(--max-pairs "$SOURCE_PAIR_LIMIT"); fi
          npm exec -- tsx scripts/import-missing-reviewed-word-sources.mts \
            --snapshot-dir "$RUNNER_TEMP/kanji-content-snapshots/$SOURCE_SNAPSHOT_VERSION" "${args[@]}"

      - name: Apply missing reviewed word sources
        if: ${{ (inputs.mode == 'apply' || inputs.mode == 'apply_sources') && steps.selection.outputs.supplement_word_sources == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SOURCE_SNAPSHOT_VERSION: ${{ steps.source-pin.outputs.version }}
        shell: bash
        run: |
          args=()
          IFS=',' read -ra ids <<< "$WORD_BATCH"
          for id in "${ids[@]}"; do args+=(--batch "$id"); done
          if [ "$CURATION_MODE" = 'apply_sources' ]; then args+=(--max-pairs "$SOURCE_PAIR_LIMIT"); fi
          npm exec -- tsx scripts/import-missing-reviewed-word-sources.mts \
            --snapshot-dir "$RUNNER_TEMP/kanji-content-snapshots/$SOURCE_SNAPSHOT_VERSION" "${args[@]}" --apply

      - name: Preflight selected kanji without mutations
        # Apply validates live sources and placements internally before any teaching write.
        if: ${{ inputs.mode == 'plan' && steps.selection.outputs.apply_kanji == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          if [ -n "$KANJI_BATCH" ]; then args+=(--batch "$KANJI_BATCH"); fi
          npm run db:curate -- --preflight-only "${args[@]}"

      - name: Apply versioned main-course curation
        if: ${{ inputs.mode == 'apply' && steps.selection.outputs.apply_kanji == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          if [ -n "$KANJI_BATCH" ]; then args+=(--batch "$KANJI_BATCH"); fi
          if [ "$STAGE_KANJI_PAIRS" = 'true' ]; then args+=(--stage-pairs); fi
          npm run db:curate -- "${args[@]}"

      - name: Preflight reviewed vocabulary without mutations
        # Apply performs this scoped database preflight internally before any teaching write.
        if: ${{ inputs.mode == 'plan' && steps.selection.outputs.apply_words == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          if [ -n "$WORD_BATCH" ]; then
            IFS=',' read -ra ids <<< "$WORD_BATCH"
            for id in "${ids[@]}"; do args+=(--batch "$id"); done
          fi
          npm run db:curate:words -- --preflight-only "${args[@]}"

      - name: Apply reviewed vocabulary and original examples
        if: ${{ inputs.mode == 'apply' && steps.selection.outputs.apply_words == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=()
          if [ -n "$WORD_BATCH" ]; then
            IFS=',' read -ra ids <<< "$WORD_BATCH"
            for id in "${ids[@]}"; do args+=(--batch "$id"); done
          fi
          if [ "$STAGE_WORD_PAIRS" = 'true' ]; then args+=(--stage-pairs); fi
          if [ "$STAGE_WORD_WIDTH" = '4' ]; then args+=(--stage-width 4); fi
          npm run db:curate:words -- "${args[@]}"

      - name: Verify complete receipts for the selected teaching writes
        if: ${{ inputs.mode == 'apply' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          args=(--expect complete)
          if [ -n "$KANJI_BATCH" ]; then args+=(--kanji-batch "$KANJI_BATCH"); fi
          if [ -n "$WORD_BATCH" ]; then
            IFS=',' read -ra ids <<< "$WORD_BATCH"
            for id in "${ids[@]}"; do args+=(--word-batch "$id"); done
          fi
          npm run content:receipts -- "${args[@]}"

      - name: Write post-curation corpus report
        if: ${{ inputs.mode == 'apply' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: >-
          npm run content:report --
          --require-full
          --output "$RUNNER_TEMP/task-118-corpus-report.json"

      - name: Verify published main-course content quality
        if: ${{ inputs.mode == 'apply' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: >-
          npm run content:quality --
          --output "$RUNNER_TEMP/task-119-quality-report.json"

      - name: Check release preservation and remove private fingerprint baseline
        if: ${{ always() && inputs.mode == 'apply' && steps.preservation.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm exec -- tsx packages/db/prisma/check-curation-preservation.ts compare

      - name: Upload corpus report
        if: ${{ always() && inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: task-118-curation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/task-118-corpus-report.json
            ${{ runner.temp }}/task-119-quality-report.json
          if-no-files-found: warn
          retention-days: 90
