name: Manual Remote Study Smoke

on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Published finite pilot to audit
        required: true
        default: v1
        type: choice
        options:
          - v1
          - v2
          - v3
          - v4
          - v5
          - v6
          - v7
      expected_web_revision:
        description: Expected full web commit SHA (blank skips matching)
        required: false
        type: string
      expected_api_revision:
        description: Expected full API commit SHA (blank skips matching)
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run one bounded audit
        id: audit
        env:
          STAGING_WEB_URL: https://kanji-app-rho.vercel.app
          STAGING_API_URL: https://kanji-srs-api.onrender.com
          PILOT_VERSION: ${{ inputs.pilot }}
          EXPECTED_WEB_REVISION_INPUT: ${{ inputs.expected_web_revision }}
          EXPECTED_API_REVISION_INPUT: ${{ inputs.expected_api_revision }}
          STAGING_SMOKE_REPORT_PATH: ${{ runner.temp }}/remote-study-smoke.json
        run: |
          case "$PILOT_VERSION" in
            v1) export STAGING_SMOKE_COURSE_SLUG=japanese-foundation-pilot-v1 ;;
            v2) export STAGING_SMOKE_COURSE_SLUG=japanese-foundation-pilot-v2 ;;
            v3) export STAGING_SMOKE_COURSE_SLUG=japanese-foundation-pilot-v3 ;;
            v4) export STAGING_SMOKE_COURSE_SLUG=japanese-foundation-pilot-v4 ;;
            v5) export STAGING_SMOKE_COURSE_SLUG=japanese-foundation-pilot-v5 ;;
            v6) export STAGING_SMOKE_COURSE_SLUG=japanese-foundation-pilot-v6 ;;
            v7) export STAGING_SMOKE_COURSE_SLUG=japanese-foundation-pilot-v7 ;;
            *) echo "Unsupported pilot version."; exit 1 ;;
          esac
          if [ -n "$EXPECTED_WEB_REVISION_INPUT" ]; then
            export STAGING_EXPECTED_WEB_REVISION="$EXPECTED_WEB_REVISION_INPUT"
          fi
          if [ -n "$EXPECTED_API_REVISION_INPUT" ]; then
            export STAGING_EXPECTED_API_REVISION="$EXPECTED_API_REVISION_INPUT"
          fi
          npm run smoke:remote
      - name: Upload sanitized measurements
        if: ${{ always() && steps.audit.outputs.report_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: remote-study-smoke
          path: ${{ runner.temp }}/remote-study-smoke.json
          if-no-files-found: error
          retention-days: 7
